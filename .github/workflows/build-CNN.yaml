on:
 workflow_call: 
      
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Build the build file
      run: |
        rm -rf build
        mkdir build
        cmake -S . -B build
        cmake --build build
        
# UPLOAD: Saves the binary to GitHub's storage
    - name: Save Compiled Binary
      uses: actions/upload-artifact@v4
      with:
          name: cnn-binary
          path: build/BUILD_CNN_FROM_SCRATCH
          
    
